<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.8)"/>

  <g transform="translate(460, 110)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="680" rx="18" fill="#071B2D" stroke="#EF4444" stroke-width="1.5"/>
    
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Crear Nuevo Nodo</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Configura un nuevo espacio de colaboración</text>

      <!-- Error alert -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="448" height="42" rx="8" fill="rgba(239,68,68,0.2)" stroke="#EF4444"/>
        <text x="14" y="26" fill="#FCA5A5" font-size="12" font-weight="700">Error 409: Ya existe un nodo con el nombre especificado.</text>
      </g>

      <!-- Field 1 with Error -->
      <text x="0" y="145" fill="#EF4444" font-size="12" font-weight="700">NOMBRE DEL NODO (DUPLICADO)</text>
      <rect x="0" y="155" width="448" height="44" rx="8" fill="#03101E" stroke="#EF4444" stroke-width="1.5"/>
      <text x="16" y="182" fill="#F1F5F9" font-size="14">Sala Principal — ISW 2</text>

      <!-- Field 2 -->
      <text x="0" y="225" fill="#94A3B8" font-size="12" font-weight="700">DESCRIPCIÓN</text>
      <rect x="0" y="235" width="448" height="80" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="265" fill="#F1F5F9" font-size="14">Espacio de cátedra para entregas de sprint.</text>

      <!-- Buttons -->
      <g transform="translate(0, 540)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cancelar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="#EF4444" cursor="pointer"/>
        <text x="343" y="28" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">Cambiar Nombre</text>
      </g>
    </g>
  </g>
</svg>