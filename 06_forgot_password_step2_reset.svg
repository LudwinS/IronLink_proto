<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="864" height="900" fill="url(#gradHero)" stroke="#103A5C" stroke-width="0.5"/>
  <circle cx="200" cy="250" r="180" fill="#14E3A4" opacity="0.08" filter="url(#glow)"/>
  
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#071B2D" stroke="#103A5C"/>
    <text x="64" y="32" fill="#F1F5F9" font-size="24" font-weight="800">IronLink</text>
    <text x="0" y="130" fill="#14E3A4" font-size="14" font-weight="700" letter-spacing="2">PASO 2 DE 2</text>
    <text x="0" y="190" fill="#F1F5F9" font-size="44" font-weight="800">Ingresa el código</text>
    <text x="0" y="240" fill="#14E3A4" font-size="44" font-weight="800">y tu nueva clave.</text>
  </g>

  <g transform="translate(864, 0)">
    <rect x="0" y="0" width="576" height="900" fill="#03101E"/>
    <g transform="translate(70, 110)">
      <text x="0" y="40" fill="#F1F5F9" font-size="26" font-weight="800">Restablecer contraseña</text>
      <text x="0" y="65" fill="#94A3B8" font-size="13">Código enviado a l***n@universidad.edu.sv</text>

      <!-- OTP 6 digits mini -->
      <text x="0" y="110" fill="#94A3B8" font-size="12" font-weight="600">Código de 6 dígitos</text>
      <g transform="translate(0, 122)">
        <rect x="0" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="32" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">5</text>
        <rect x="74" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="106" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">1</text>
        <rect x="148" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="180" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">8</text>
        <rect x="222" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="254" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">9</text>
        <rect x="296" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="328" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">2</text>
        <rect x="370" y="0" width="65" height="44" rx="8" fill="#071B2D" stroke="#14E3A4"/>
        <text x="402" y="28" fill="#14E3A4" font-size="18" font-weight="700" text-anchor="middle">0</text>
      </g>

      <!-- New password -->
      <text x="0" y="200" fill="#94A3B8" font-size="12" font-weight="600">Nueva contraseña (Argon2id)</text>
      <rect x="0" y="212" width="436" height="46" rx="8" fill="#071B2D" stroke="#103A5C"/>
      <text x="14" y="240" fill="#94A3B8" font-size="16">••••••••••••••••</text>

      <!-- Confirm new password -->
      <text x="0" y="285" fill="#94A3B8" font-size="12" font-weight="600">Confirmar nueva contraseña</text>
      <rect x="0" y="297" width="436" height="46" rx="8" fill="#071B2D" stroke="#103A5C"/>
      <text x="14" y="325" fill="#94A3B8" font-size="16">••••••••••••••••</text>

      <rect x="0" y="375" width="436" height="48" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="218" y="405" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">GUARDAR NUEVA CLAVE</text>
    </g>
  </g>

</svg>