<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="#03101E"/>
  <circle cx="720" cy="350" r="260" fill="#00FFD0" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(470, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="500" height="520" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    
    <g transform="translate(40, 50)">
      <circle cx="210" cy="50" r="36" fill="rgba(0,255,208,0.15)" stroke="#00FFD0"/>
      <text x="210" y="58" fill="#00FFD0" font-size="28" text-anchor="middle">📬</text>

      <text x="210" y="130" fill="#F1F5F9" font-size="22" font-weight="800" text-anchor="middle">Revisa tu bandeja de entrada</text>
      <text x="210" y="160" fill="#94A3B8" font-size="14" text-anchor="middle">Hemos enviado un enlace mágico a:</text>
      <text x="210" y="185" fill="#00FFD0" font-size="15" font-weight="700" text-anchor="middle">ludwin@universidad.edu.sv</text>

      <rect x="20" y="230" width="380" height="54" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="210" y="262" fill="#64748B" font-size="13" text-anchor="middle">Esperando confirmación del navegador...</text>

      <text x="210" y="330" fill="#14E3A4" font-size="13" font-weight="700" text-anchor="middle">¿No lo recibiste? Reenviar en 45s</text>

      <rect x="10" y="370" width="400" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
      <text x="210" y="398" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">Cambiar a verificación por código PIN</text>
    </g>
  </g>

</svg>