<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hero Panel Left -->
  <rect x="0" y="0" width="864" height="900" fill="url(#gradHero)" stroke="#103A5C" stroke-width="0.5"/>
  <circle cx="200" cy="250" r="180" fill="#EF4444" opacity="0.05" filter="url(#glow)"/>
  
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="none" stroke="#14E3A4" stroke-width="3"/>
    <circle cx="24" cy="24" r="4" fill="#00FFD0"/>
    <text x="64" y="32" fill="#F1F5F9" font-size="24" font-weight="800">IronLink</text>
    <text x="0" y="130" fill="#14E3A4" font-size="14" font-weight="700" letter-spacing="2">CONECTA • COMUNICA • COLABORA</text>
    <text x="0" y="190" fill="#F1F5F9" font-size="44" font-weight="800">Red descentralizada</text>
    <text x="0" y="240" fill="#F1F5F9" font-size="44" font-weight="800">para equipos de alta</text>
    <text x="0" y="290" fill="#00FFD0" font-size="44" font-weight="800">ingeniería de software.</text>
  </g>

  <!-- Right Form Panel (ERROR STATE) -->
  <g transform="translate(864, 0)">
    <rect x="0" y="0" width="576" height="900" fill="#03101E"/>
    
    <g transform="translate(70, 130)">
      <text x="0" y="40" fill="#F1F5F9" font-size="28" font-weight="800">Bienvenido de nuevo</text>
      <text x="0" y="70" fill="#94A3B8" font-size="14">Ingresa tus credenciales para acceder a la red</text>

      <!-- Error Banner -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="436" height="46" rx="10" fill="rgba(239,68,68,0.15)" stroke="#EF4444" stroke-width="1"/>
        <text x="14" y="28" fill="#EF4444" font-size="16">⚠️</text>
        <text x="38" y="28" fill="#FCA5A5" font-size="13" font-weight="600">Credenciales inválidas. Verifica tu correo y clave.</text>
      </g>

      <!-- Email Field -->
      <text x="0" y="175" fill="#94A3B8" font-size="13" font-weight="600">Correo institucional o usuario</text>
      <rect x="0" y="190" width="436" height="48" rx="10" fill="#071B2D" stroke="#EF4444" stroke-width="1.5"/>
      <text x="16" y="220" fill="#F1F5F9" font-size="14">ludwin@universidad.edu.sv</text>

      <!-- Password Field with Error -->
      <text x="0" y="270" fill="#EF4444" font-size="13" font-weight="600">Contraseña incorrecta</text>
      <rect x="0" y="285" width="436" height="48" rx="10" fill="#071B2D" stroke="#EF4444" stroke-width="1.5"/>
      <text x="16" y="315" fill="#EF4444" font-size="16">••••••••••••••••</text>
      <text x="0" y="352" fill="#EF4444" font-size="12">Intento 3 de 5 antes del bloqueo temporal de seguridad.</text>
      
      <!-- Submit Button (Disabled or retry) -->
      <rect x="0" y="380" width="436" height="50" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="218" y="411" fill="#03101E" font-size="15" font-weight="800" text-anchor="middle">REINTENTAR ACCESO</text>

      <!-- Forgot Password link highlighted in red -->
      <text x="140" y="470" fill="#94A3B8" font-size="14">¿Olvidaste tu contraseña?</text>
      <text x="310" y="470" fill="#14E3A4" font-size="14" font-weight="700">Recupérala aquí</text>
    </g>
  </g>
</svg>