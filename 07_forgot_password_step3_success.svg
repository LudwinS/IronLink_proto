<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="#03101E"/>
  <circle cx="720" cy="350" r="260" fill="#14E3A4" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(470, 180)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="500" height="460" rx="18" fill="#071B2D" stroke="#14E3A4" stroke-width="1.5"/>
    
    <g transform="translate(40, 50)">
      <circle cx="210" cy="50" r="40" fill="rgba(20,227,164,0.2)" stroke="#14E3A4" stroke-width="2"/>
      <path d="M195 50 L205 60 L228 38" stroke="#14E3A4" stroke-width="4" fill="none" stroke-linecap="round"/>

      <text x="210" y="130" fill="#F1F5F9" font-size="24" font-weight="800" text-anchor="middle">¡Contraseña Actualizada!</text>
      <text x="210" y="160" fill="#94A3B8" font-size="14" text-anchor="middle">Tu clave fue hasheada y renovada exitosamente.</text>
      <text x="210" y="182" fill="#64748B" font-size="13" text-anchor="middle">Ahora puedes ingresar con tus nuevas credenciales.</text>

      <rect x="10" y="240" width="400" height="48" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="210" y="270" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">INICIAR SESIÓN AHORA</text>
    </g>
  </g>

</svg>