          <text x="16" y="21" fill="#03101E" font-size="12" font-weight="800" text-anchor="middle">LU</text>
        </g>
      </g>
    </g>
    

  <g transform="translate(240, 64)">
    <!-- Subgrupo Header -->
    <rect x="0" y="0" width="1200" height="64" fill="#071B2D" stroke="#00FFD0" stroke-width="1"/>
    <g transform="translate(24, 18)">
      <text x="0" y="18" fill="#00FFD0" font-size="17" font-weight="800"># 🦀 Equipo Backend Axum &amp; DB</text>
      <text x="320" y="16" fill="#94A3B8" font-size="12">Subgrupo privado de desarrollo · 3 miembros</text>
    </g>

    <!-- Messages specific to backend -->
    <g transform="translate(40, 100)">
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="18" fill="#0A5C52"/>
        <text x="20" y="25" fill="#14E3A4" font-size="11" font-weight="800" text-anchor="middle">CM</text>
        <text x="50" y="16" fill="#F1F5F9" font-size="14" font-weight="700">Carlos Morales</text>
        <text x="50" y="42" fill="#94A3B8" font-size="14">Configuré el pool de SQLx con un máximo de 10 conexiones simultáneas.</text>
      </g>

      <g transform="translate(0, 75)">
        <circle cx="20" cy="20" r="18" fill="url(#gradAvatar)"/>
        <text x="20" y="25" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">LU</text>
        <text x="50" y="16" fill="#14E3A4" font-size="14" font-weight="700">Ludwin (Tú)</text>
        <text x="50" y="42" fill="#F1F5F9" font-size="14">Perfecto, eso evita saturar PostgreSQL durante las pruebas de carga.</text>
      </g>
    </g>

    <g transform="translate(30, 680)">
      <rect x="0" y="0" width="880" height="54" rx="12" fill="#071B2D" stroke="#00FFD0"/>
      <text x="20" y="32" fill="#475569" font-size="14">Escribe un mensaje en # 🦀 Backend Axum...</text>
    </g>
