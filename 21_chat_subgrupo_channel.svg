      <text x="26" y="367" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="367" fill="#94A3B8" font-size="13" font-weight="700">Sala Principal</text>

      
        <rect x="24" y="380" width="204" height="34" rx="6" fill="rgba(0,255,208,0.15)"/>
        <text x="36" y="402" fill="#00FFD0" font-size="12" font-weight="700">↳ 🦀 Backend Axum</text>
        

