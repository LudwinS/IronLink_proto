<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.85)"/>
  <g transform="translate(420, 90)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="600" height="720" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Detalles del Nodo — Sala Principal</text>
      
      <!-- Tabs (Participantes / Baneados) -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="160" height="34" rx="6" fill="rgba(20,227,164,0.15)" stroke="#14E3A4"/>
        <text x="80" y="22" fill="#14E3A4" font-size="12" font-weight="700" text-anchor="middle">Participantes (8)</text>

        <rect x="170" y="0" width="160" height="34" rx="6" fill="#03101E" stroke="#103A5C"/>
        <text x="250" y="22" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">Baneados (0)</text>
      </g>

      <!-- Member List with RBAC controls -->
      <g transform="translate(0, 110)">
        <!-- Member 1: Ludwin (Owner) -->
        <rect x="0" y="0" width="528" height="60" rx="10" fill="#03101E" stroke="#103A5C"/>
        <circle cx="30" cy="30" r="16" fill="url(#gradAvatar)"/>
        <text x="30" y="35" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">LU</text>
        <text x="60" y="26" fill="#F1F5F9" font-size="14" font-weight="700">Ludwin Saúl Vásquez (Tú)</text>
        <text x="60" y="44" fill="#14E3A4" font-size="11">PROPIETARIO / OWNER</text>

        <!-- Member 2: Carlos M. -->
        <rect x="0" y="70" width="528" height="60" rx="10" fill="#03101E" stroke="#103A5C"/>
        <circle cx="30" cy="30" r="16" fill="#0A5C52"/>
        <text x="30" y="35" fill="#14E3A4" font-size="11" font-weight="800" text-anchor="middle">CM</text>
        <text x="60" y="26" fill="#F1F5F9" font-size="14" font-weight="700">Carlos Morales</text>
        <text x="60" y="44" fill="#94A3B8" font-size="11">MIEMBRO · Backend Dev</text>
        <rect x="420" y="16" width="90" height="28" rx="6" fill="rgba(239,68,68,0.2)"/>
        <text x="465" y="34" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">Expulsar</text>

        <!-- Member 3: Diana R. -->
        <rect x="0" y="140" width="528" height="60" rx="10" fill="#03101E" stroke="#103A5C"/>
        <circle cx="30" cy="30" r="16" fill="#103A5C"/>
        <text x="30" y="35" fill="#00FFD0" font-size="11" font-weight="800" text-anchor="middle">DR</text>
        <text x="60" y="26" fill="#F1F5F9" font-size="14" font-weight="700">Diana Rivera</text>
        <text x="60" y="44" fill="#94A3B8" font-size="11">MIEMBRO · Frontend Dev</text>
        <rect x="420" y="16" width="90" height="28" rx="6" fill="rgba(239,68,68,0.2)"/>
        <text x="465" y="34" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">Expulsar</text>
      </g>

      <!-- Token copy section -->
      <g transform="translate(0, 480)">
        <text x="0" y="16" fill="#94A3B8" font-size="12" font-weight="700">TOKEN DE ACCESO P2P</text>
        <rect x="0" y="28" width="528" height="44" rx="8" fill="#03101E" stroke="#14E3A4" stroke-dasharray="4"/>
        <text x="16" y="55" fill="#14E3A4" font-size="13" font-weight="700">IRL-A9F34C2B-2026-ENCRYPTED</text>
        <rect x="420" y="34" width="90" height="32" rx="6" fill="#14E3A4"/>
        <text x="465" y="54" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">COPIAR</text>
      </g>
    </g>
  </g>

</svg>