<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark backdrop overlay -->
  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.75)"/>

  <!-- Left: Modal Crear Nodo (Width: 520px) -->
  <g transform="translate(140, 120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="660" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Crear Nuevo Nodo</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Configura un nuevo espacio de colaboración descentralizado</text>

      <!-- Field 1: Nombre del Nodo -->
      <text x="0" y="95" fill="#94A3B8" font-size="12" font-weight="700">NOMBRE DEL NODO</text>
      <rect x="0" y="105" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="132" fill="#F1F5F9" font-size="14">Equipo de Arquitectura de Software</text>

      <!-- Field 2: Descripción -->
      <text x="0" y="180" fill="#94A3B8" font-size="12" font-weight="700">DESCRIPCIÓN</text>
      <rect x="0" y="190" width="448" height="80" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="220" fill="#F1F5F9" font-size="14">Espacio para diseño de diagramas C4 y microservicios.</text>

      <!-- Field 3: Token de Acceso -->
      <text x="0" y="300" fill="#94A3B8" font-size="12" font-weight="700">TOKEN DE ACCESO P2P (GENERADO)</text>
      <rect x="0" y="310" width="448" height="44" rx="8" fill="#03101E" stroke="#14E3A4" stroke-dasharray="4"/>
      <text x="16" y="337" fill="#14E3A4" font-size="14" font-weight="700">IRL-9982FA8C-2026</text>

      <!-- Buttons -->
      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cancelar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="343" y="28" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">Crear Nodo</text>
      </g>
    </g>
  </g>

  <!-- Right: Modal Perfil de Usuario (Width: 520px) -->
  <g transform="translate(780, 120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="660" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>

    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Perfil de Usuario</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Personaliza tu identidad y estado en IronLink</text>

      <!-- Avatar with Color Palette -->
      <g transform="translate(0, 75)">
        <circle cx="36" cy="36" r="36" fill="url(#gradAvatar)" stroke="#103A5C" stroke-width="2"/>
        <text x="36" y="44" fill="#03101E" font-size="20" font-weight="800" text-anchor="middle">LU</text>
        
        <!-- 8 Color chips -->
        <g transform="translate(90, 20)">
          <circle cx="10" cy="15" r="10" fill="#00E5FF" stroke="#F1F5F9" stroke-width="2"/>
          <circle cx="38" cy="15" r="10" fill="#14E3A4"/>
          <circle cx="66" cy="15" r="10" fill="#8B5CF6"/>
          <circle cx="94" cy="15" r="10" fill="#F59E0B"/>
          <circle cx="122" cy="15" r="10" fill="#EF4444"/>
          <circle cx="150" cy="15" r="10" fill="#3B82F6"/>
          <circle cx="178" cy="15" r="10" fill="#EC4899"/>
        </g>
      </g>

      <!-- Field 1: Nombre -->
      <text x="0" y="190" fill="#94A3B8" font-size="12" font-weight="700">NOMBRE COMPLETO</text>
      <rect x="0" y="200" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="227" fill="#F1F5F9" font-size="14">Ludwin</text>

      <!-- Field 2: Estado -->
      <text x="0" y="275" fill="#94A3B8" font-size="12" font-weight="700">ESTADO PERSONALIZADO</text>
      <rect x="0" y="285" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="312" fill="#14E3A4" font-size="14">⚡ Desarrollando en IronLink</text>

      <!-- Field 3: Bio -->
      <text x="0" y="360" fill="#94A3B8" font-size="12" font-weight="700">BIOGRAFÍA / ROL ACADÉMICO</text>
      <rect x="0" y="370" width="448" height="60" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="398" fill="#94A3B8" font-size="13">Estudiante de Ing. de Software 2 · Ciclo 2-2026</text>

      <!-- Buttons -->
      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cerrar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="343" y="28" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">Guardar Cambios</text>
      </g>
    </g>
  </g>
</svg>