<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.8)"/>
  <g transform="translate(460, 120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="660" rx="18" fill="#071B2D" stroke="#14E3A4" stroke-width="1.5"/>
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Programar Sesión Síncrona</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Videollamada para coordinación de sprint o clases</text>

      <text x="0" y="95" fill="#94A3B8" font-size="12" font-weight="700">TÍTULO DE LA REUNIÓN</text>
      <rect x="0" y="105" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="132" fill="#F1F5F9" font-size="14">Revisión de Arquitectura Sprint 2</text>

      <text x="0" y="175" fill="#94A3B8" font-size="12" font-weight="700">FECHA Y HORA (HORA LOCAL / UTC-6)</text>
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="215" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
        <text x="16" y="27" fill="#F1F5F9" font-size="14">📅 26/08/2026</text>

        <rect x="233" y="0" width="215" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
        <text x="249" y="27" fill="#14E3A4" font-size="14">⏰ 10:00 AM</text>
      </g>

      <text x="0" y="255" fill="#94A3B8" font-size="12" font-weight="700">DURACIÓN ESTIMADA</text>
      <g transform="translate(0, 265)">
        <rect x="0" y="0" width="90" height="34" rx="6" fill="rgba(20,227,164,0.15)" stroke="#14E3A4"/>
        <text x="45" y="22" fill="#14E3A4" font-size="12" font-weight="700" text-anchor="middle">30 min</text>

        <rect x="105" y="0" width="90" height="34" rx="6" fill="#03101E" stroke="#103A5C"/>
        <text x="150" y="22" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">45 min</text>

        <rect x="210" y="0" width="90" height="34" rx="6" fill="#03101E" stroke="#103A5C"/>
        <text x="255" y="22" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">60 min</text>
      </g>

      <text x="0" y="330" fill="#94A3B8" font-size="12" font-weight="700">ENLACE DE VIDEOLLAMADA (GOOGLE MEET / WEBRTC)</text>
      <rect x="0" y="340" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="367" fill="#00FFD0" font-size="13">https://meet.google.com/abc-iron-link</text>

      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cancelar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="343" y="28" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">Agendar Reunión</text>
      </g>
    </g>
  </g>

</svg>