<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#03101E"/>
  <circle cx="720" cy="300" r="280" fill="#14E3A4" opacity="0.05" filter="url(#glow)"/>

  <g transform="translate(470, 140)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="500" height="580" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    
    <g transform="translate(40, 40)">
      <!-- Icon Mail / OTP -->
      <circle cx="210" cy="40" r="32" fill="rgba(20,227,164,0.15)" stroke="#14E3A4"/>
      <text x="210" y="48" fill="#14E3A4" font-size="26" text-anchor="middle">✉️</text>

      <text x="210" y="115" fill="#F1F5F9" font-size="22" font-weight="800" text-anchor="middle">Verifica tu correo</text>
      <text x="210" y="140" fill="#94A3B8" font-size="13" text-anchor="middle">Hemos enviado un código PIN de 6 dígitos a:</text>
      <text x="210" y="162" fill="#14E3A4" font-size="14" font-weight="700" text-anchor="middle">ludwin@universidad.edu.sv</text>

      <!-- 6 OTP Boxes -->
      <g transform="translate(10, 200)">
        <rect x="0" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#14E3A4" stroke-width="2"/>
        <text x="27" y="42" fill="#14E3A4" font-size="26" font-weight="800" text-anchor="middle">8</text>

        <rect x="68" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#14E3A4" stroke-width="2"/>
        <text x="95" y="42" fill="#14E3A4" font-size="26" font-weight="800" text-anchor="middle">4</text>

        <rect x="136" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#14E3A4" stroke-width="2"/>
        <text x="163" y="42" fill="#14E3A4" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="204" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#103A5C"/>
        <text x="231" y="42" fill="#F1F5F9" font-size="26" font-weight="800" text-anchor="middle">1</text>

        <rect x="272" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#103A5C"/>
        <text x="299" y="42" fill="#F1F5F9" font-size="26" font-weight="800" text-anchor="middle">5</text>

        <rect x="340" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#103A5C"/>
        <text x="367" y="42" fill="#F1F5F9" font-size="26" font-weight="800" text-anchor="middle">2</text>
      </g>

      <!-- Timer & Resend -->
      <text x="210" y="305" fill="#64748B" font-size="13" text-anchor="middle">Reenviar código en <tspan fill="#00FFD0" font-weight="700">00:42</tspan></text>

      <!-- Submit Button -->
      <rect x="10" y="340" width="400" height="48" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="210" y="370" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">CONFIRMAR CÓDIGO</text>

      <text x="210" y="430" fill="#94A3B8" font-size="13" text-anchor="middle">¿Ingresaste el correo mal? <tspan fill="#14E3A4" font-weight="700">Cambiar correo</tspan></text>
    </g>
  </g>
</svg>