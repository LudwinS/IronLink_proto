<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="#03101E"/>
  <g transform="translate(470, 140)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="500" height="580" rx="18" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    
    <g transform="translate(40, 40)">
      <text x="210" y="30" fill="#F1F5F9" font-size="22" font-weight="800" text-anchor="middle">Elige tu método de verificación</text>
      <text x="210" y="55" fill="#94A3B8" font-size="13" text-anchor="middle">Selecciona cómo deseas autenticar tu cuenta</text>

      <!-- Option 1: OTP PIN -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="420" height="110" rx="12" fill="#03101E" stroke="#14E3A4" stroke-width="2" cursor="pointer"/>
        <circle cx="36" cy="55" r="20" fill="rgba(20,227,164,0.15)"/>
        <text x="36" y="61" fill="#14E3A4" font-size="18" text-anchor="middle">🔢</text>
        <text x="70" y="45" fill="#F1F5F9" font-size="16" font-weight="700">Código PIN de 6 dígitos</text>
        <text x="70" y="70" fill="#94A3B8" font-size="12">Recibe un código numérico temporal en tu correo.</text>
        <text x="70" y="90" fill="#14E3A4" font-size="11" font-weight="700">RECOMENDADO · Vence en 15 min</text>
      </g>

      <!-- Option 2: Magic Link -->
      <g transform="translate(0, 225)">
        <rect x="0" y="0" width="420" height="110" rx="12" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <circle cx="36" cy="55" r="20" fill="#071B2D"/>
        <text x="36" y="61" fill="#00FFD0" font-size="18" text-anchor="middle">🪄</text>
        <text x="70" y="45" fill="#F1F5F9" font-size="16" font-weight="700">Enlace Mágico (Magic Link)</text>
        <text x="70" y="70" fill="#94A3B8" font-size="12">Recibe un enlace de 1 solo clic para verificar sin código.</text>
      </g>

      <rect x="10" y="380" width="400" height="48" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="210" y="410" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">CONTINUAR</text>
    </g>
  </g>

</svg>