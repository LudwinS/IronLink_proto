<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.8)"/>
  <g transform="translate(460, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="560" rx="18" fill="#071B2D" stroke="#00FFD0" stroke-width="1.5"/>
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Crear Nuevo Subgrupo</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Espacio temático dentro de # Sala Principal</text>

      <text x="0" y="100" fill="#94A3B8" font-size="12" font-weight="700">NOMBRE DEL SUBGRUPO</text>
      <rect x="0" y="112" width="448" height="44" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="139" fill="#F1F5F9" font-size="14">Seguridad Criptográfica &amp; JWT</text>

      <text x="0" y="185" fill="#94A3B8" font-size="12" font-weight="700">DESCRIPCIÓN</text>
      <rect x="0" y="197" width="448" height="65" rx="8" fill="#03101E" stroke="#103A5C"/>
      <text x="16" y="225" fill="#F1F5F9" font-size="14">Auditoría de Argon2id y rotación de tokens.</text>

      <!-- Switch Privado -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="448" height="54" rx="8" fill="#03101E" stroke="#103A5C"/>
        <text x="16" y="26" fill="#F1F5F9" font-size="13" font-weight="700">Subgrupo Privado</text>
        <text x="16" y="44" fill="#64748B" font-size="11">Solo miembros invitados podrán leer los mensajes</text>
        
        <!-- Toggle button -->
        <rect x="390" y="14" width="44" height="24" rx="12" fill="#00FFD0"/>
        <circle cx="422" cy="26" r="9" fill="#03101E"/>
      </g>

      <g transform="translate(0, 420)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cancelar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="#00FFD0" cursor="pointer"/>
        <text x="343" y="28" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">Crear Subgrupo</text>
      </g>
    </g>
  </g>

</svg>