<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
    <!-- SIDEBAR (Width: 240px) -->
    <g id="Sidebar">
      <rect x="0" y="0" width="240" height="900" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- Brand Logo -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#03101E" stroke="#103A5C"/>
        <circle cx="17" cy="17" r="8" fill="none" stroke="#14E3A4" stroke-width="2.5"/>
        <circle cx="17" cy="17" r="3.5" fill="#00FFD0"/>
        <text x="46" y="24" fill="#F1F5F9" font-size="18" font-weight="800" letter-spacing="0.5">IronLink</text>
      </g>

      <!-- Section: NAVEGACIÓN -->
      <text x="20" y="92" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">NAVEGACIÓN</text>
      
      <!-- Item: Inicio -->
      <rect x="12" y="104" width="216" height="38" rx="8" fill="transparent"/>
      <circle cx="32" cy="123" r="3" fill="#94A3B8"/>
      <text x="48" y="128" fill="#94A3B8" font-size="13" font-weight="500">Inicio</text>

      <!-- Item: Mis nodos -->
      <rect x="12" y="146" width="216" height="38" rx="8" fill="transparent"/>
      <rect x="26" y="157" width="12" height="12" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="48" y="170" fill="#94A3B8" font-size="13" font-weight="500">Mis nodos</text>

      <!-- Item: Unirse a nodo -->
      <rect x="12" y="188" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="212" fill="#94A3B8" font-size="14">🔗</text>
      <text x="48" y="212" fill="#94A3B8" font-size="13" font-weight="500">Unirse a nodo</text>

      <!-- Section: RED -->
      <text x="20" y="254" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">RED</text>
      <rect x="12" y="266" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="290" fill="#94A3B8" font-size="14">🛡️</text>
      <text x="48" y="290" fill="#94A3B8" font-size="13" font-weight="500">Túnel VPN</text>

      <!-- Section: CANALES DE CHAT -->
      <text x="20" y="332" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">CANALES DE CHAT</text>
      
      <!-- Canal 1 -->
      <rect x="12" y="344" width="216" height="36" rx="8" fill="rgba(20,227,164,0.12)"/>
      <text x="26" y="367" fill="#14E3A4" font-size="13" font-weight="600">#</text>
      <text x="42" y="367" fill="#14E3A4" font-size="13" font-weight="700">Sala Principal</text>

      <!-- Canal 2 -->
      <rect x="12" y="384" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="407" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="407" fill="#94A3B8" font-size="13" font-weight="500">Backend Rust</text>

      <!-- Canal 3 -->
      <rect x="12" y="424" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="447" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="447" fill="#94A3B8" font-size="13" font-weight="500">Frontend UI/UX</text>

      <!-- Section: PERFIL (Bottom) -->
      <g transform="translate(0, 720)">
        <line x1="12" y1="0" x2="228" y2="0" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="24" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">PERFIL</text>
        
        <!-- User info button -->
        <rect x="12" y="34" width="216" height="42" rx="8" fill="transparent"/>
        <circle cx="32" cy="55" r="12" fill="#0A5C52" stroke="#14E3A4" stroke-width="1"/>
        <text x="32" y="59" fill="#14E3A4" font-size="10" font-weight="800" text-anchor="middle">LU</text>
        <text x="52" y="54" fill="#F1F5F9" font-size="13" font-weight="600">Ludwin</text>
        <rect x="52" y="59" width="46" height="15" rx="4" fill="rgba(20,227,164,0.15)"/>
        <text x="75" y="70" fill="#14E3A4" font-size="9" font-weight="800" text-anchor="middle">ADMIN</text>

        <!-- Config button -->
        <rect x="12" y="80" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="102" fill="#94A3B8" font-size="13">⚙️</text>
        <text x="48" y="102" fill="#94A3B8" font-size="13" font-weight="500">Configuración</text>

        <!-- Logout button -->
        <rect x="12" y="118" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="140" fill="#EF4444" font-size="13">🚪</text>
        <text x="48" y="140" fill="#EF4444" font-size="13" font-weight="600">Cerrar sesión</text>
      </g>
    </g>
    
  
    <!-- TOPBAR (Height: 64px, Width: 1200px) -->
    <g id="TopBar" transform="translate(240, 0)">
      <rect x="0" y="0" width="1200" height="64" fill="#03101E" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- VPN Badge -->
      <g transform="translate(24, 16)">
        <rect x="0" y="0" width="210" height="32" rx="16" fill="rgba(10,92,82,0.3)" stroke="#0A5C52" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#14E3A4"/>
        <text x="28" y="20" fill="#14E3A4" font-size="12" font-weight="700" letter-spacing="0.5">VPN · SALA-PRINCIPAL-ISW2</text>
      </g>

      <!-- Network status & Latency -->
      <g transform="translate(250, 24)">
        <circle cx="6" cy="8" r="3" fill="#00FFD0"/>
        <text x="16" y="12" fill="#64748B" font-size="12">14 ms · 1.2 MB/s P2P</text>
      </g>

      <!-- Right controls -->
      <g transform="translate(1080, 16)">
        <!-- Bell Icon -->
        <circle cx="20" cy="16" r="16" fill="#071B2D" stroke="#103A5C"/>
        <text x="14" y="21" fill="#94A3B8" font-size="14">🔔</text>
        <circle cx="28" cy="8" r="4" fill="#14E3A4"/>

        <!-- User Avatar -->
        <g transform="translate(56, 0)">
          <circle cx="16" cy="16" r="18" fill="url(#gradAvatar)" stroke="#103A5C" stroke-width="1.5"/>
          <text x="16" y="21" fill="#03101E" font-size="12" font-weight="800" text-anchor="middle">LU</text>
        </g>
      </g>
    </g>
    

  <g transform="translate(240, 64)">
    <!-- Header with Tabs (Reuniones Active) -->
    <rect x="0" y="0" width="1200" height="64" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
    <g transform="translate(24, 18)">
      <text x="0" y="18" fill="#F1F5F9" font-size="17" font-weight="800"># Sala Principal — ISW 2</text>
    </g>
    <g transform="translate(420, 14)">
      <rect x="0" y="0" width="110" height="36" rx="8" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
      <text x="55" y="23" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">💬 Chat</text>

      <rect x="120" y="0" width="130" height="36" rx="8" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
      <text x="185" y="23" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">👥 Subgrupos (3)</text>

      <rect x="260" y="0" width="130" height="36" rx="8" fill="rgba(20,227,164,0.15)" stroke="#14E3A4"/>
      <text x="325" y="23" fill="#14E3A4" font-size="13" font-weight="700" text-anchor="middle">📅 Reuniones (2)</text>
    </g>

    <!-- Reuniones Header -->
    <g transform="translate(40, 95)">
      <text x="0" y="24" fill="#F1F5F9" font-size="22" font-weight="800">Reuniones y Sesiones de Nodo (2)</text>
      <text x="0" y="48" fill="#94A3B8" font-size="14">Videollamadas programadas, clases y revisiones de sprint</text>
      
      <!-- New Session Button -->
      <rect x="890" y="0" width="210" height="42" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="995" y="26" fill="#03101E" font-size="13" font-weight="800" text-anchor="middle">+ Programar Sesión</text>
    </g>

    <!-- Sessions List -->
    <g transform="translate(40, 180)">
      
      <!-- Session 1: En curso -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="1070" height="110" rx="14" fill="#071B2D" stroke="#14E3A4" stroke-width="1.5"/>
        
        <circle cx="40" cy="55" r="22" fill="rgba(20,227,164,0.2)"/>
        <text x="40" y="61" fill="#14E3A4" font-size="20" text-anchor="middle">📹</text>
        
        <g transform="translate(80, 26)">
          <g>
            <text x="0" y="16" fill="#F1F5F9" font-size="17" font-weight="700">Daily Standup — Sprint 2 IronLink</text>
            <rect x="330" y="0" width="86" height="22" rx="11" fill="rgba(239,68,68,0.2)" stroke="#EF4444"/>
            <circle cx="342" cy="11" r="3" fill="#EF4444"/>
            <text x="382" y="15" fill="#EF4444" font-size="11" font-weight="700" text-anchor="middle">EN VIVO</text>
          </g>
          <text x="0" y="46" fill="#94A3B8" font-size="13">Hoy · 10:00 AM - 10:30 AM · Enlace P2P WebRTC Seguro · Organizador: Ludwin</text>
        </g>

        <!-- Join Button -->
        <rect x="890" y="34" width="150" height="42" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="965" y="60" fill="#03101E" font-size="13" font-weight="800" text-anchor="middle">UNIRSE AHORA</text>
      </g>

      <!-- Session 2: Próxima -->
      <g transform="translate(0, 135)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="1070" height="110" rx="14" fill="#071B2D" stroke="#103A5C"/>
        
        <circle cx="40" cy="55" r="22" fill="#03101E" stroke="#103A5C"/>
        <text x="40" y="61" fill="#94A3B8" font-size="20" text-anchor="middle">📅</text>
        
        <g transform="translate(80, 26)">
          <g>
            <text x="0" y="16" fill="#F1F5F9" font-size="17" font-weight="700">Revisión de Arquitectura Backend &amp; DB</text>
            <rect x="375" y="0" width="100" height="22" rx="11" fill="#03101E" stroke="#103A5C"/>
            <text x="425" y="15" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">PROGRAMADA</text>
          </g>
          <text x="0" y="46" fill="#94A3B8" font-size="13">Mañana · 04:00 PM - 05:30 PM · Sala de Cátedra ISW · Organizador: Carlos Morales</text>
        </g>

        <!-- Join Button -->
        <rect x="890" y="34" width="150" height="42" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="965" y="60" fill="#F1F5F9" font-size="13" font-weight="600" text-anchor="middle">VER DETALLES</text>
      </g>
    </g>
  </g>
</svg>