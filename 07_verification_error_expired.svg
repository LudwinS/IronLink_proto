<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#03101E"/>
  <circle cx="720" cy="300" r="280" fill="#EF4444" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(470, 130)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="500" height="600" rx="18" fill="#071B2D" stroke="#EF4444" stroke-width="1.5"/>
    
    <g transform="translate(40, 40)">
      <circle cx="210" cy="40" r="32" fill="rgba(239,68,68,0.15)" stroke="#EF4444"/>
      <text x="210" y="48" fill="#EF4444" font-size="26" text-anchor="middle">❌</text>

      <text x="210" y="115" fill="#F1F5F9" font-size="22" font-weight="800" text-anchor="middle">Código Expirado o Inválido</text>
      
      <!-- Error Message Banner -->
      <rect x="0" y="135" width="420" height="44" rx="8" fill="rgba(239,68,68,0.2)" stroke="#EF4444"/>
      <text x="210" y="162" fill="#FCA5A5" font-size="12" font-weight="600" text-anchor="middle">Error 401: El token de verificación ha caducado (15 min).</text>

      <!-- 6 Red OTP Boxes -->
      <g transform="translate(10, 205)">
        <rect x="0" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="27" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="68" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="95" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="136" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="163" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="204" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="231" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="272" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="299" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>

        <rect x="340" y="0" width="54" height="64" rx="10" fill="#03101E" stroke="#EF4444" stroke-width="2"/>
        <text x="367" y="42" fill="#EF4444" font-size="26" font-weight="800" text-anchor="middle">9</text>
      </g>

      <!-- Resend Button Active -->
      <rect x="10" y="300" width="400" height="46" rx="10" fill="#03101E" stroke="#14E3A4" stroke-width="1.5" cursor="pointer"/>
      <text x="210" y="328" fill="#14E3A4" font-size="14" font-weight="800" text-anchor="middle">SOLICITAR NUEVO CÓDIGO</text>

      <rect x="10" y="360" width="400" height="46" rx="10" fill="#EF4444" cursor="pointer"/>
      <text x="210" y="388" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">REINTENTAR</text>
    </g>
  </g>
</svg>