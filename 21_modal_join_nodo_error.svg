<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="rgba(0,0,0,0.8)"/>

  <g transform="translate(460, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="520" height="520" rx="18" fill="#071B2D" stroke="#EF4444" stroke-width="1.5"/>
    
    <g transform="translate(36, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="20" font-weight="800">Unirse a un Nodo</text>
      <text x="0" y="48" fill="#94A3B8" font-size="13">Ingresa el token de acceso alfanumérico proporcionado</text>

      <!-- Token Input with Error -->
      <text x="0" y="110" fill="#EF4444" font-size="12" font-weight="700">TOKEN DE ACCESO P2P</text>
      <rect x="0" y="122" width="448" height="46" rx="8" fill="#03101E" stroke="#EF4444" stroke-width="1.5"/>
      <text x="16" y="151" fill="#EF4444" font-size="15" font-weight="700">IRL-TOKEN-EXPIRADO-999</text>

      <!-- Error notice -->
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="448" height="60" rx="8" fill="rgba(239,68,68,0.18)" stroke="#EF4444"/>
        <text x="16" y="24" fill="#EF4444" font-size="13" font-weight="800">❌ Error 404: Nodo no encontrado</text>
        <text x="16" y="44" fill="#FCA5A5" font-size="12">El token ha expirado, fue revocado por el administrador o no existe.</text>
      </g>

      <!-- Buttons -->
      <g transform="translate(0, 380)">
        <rect x="0" y="0" width="210" height="46" rx="10" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="105" y="28" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">Cancelar</text>

        <rect x="238" y="0" width="210" height="46" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="343" y="28" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">Verificar Token</text>
      </g>
    </g>
  </g>
</svg>