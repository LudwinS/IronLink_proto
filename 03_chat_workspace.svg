<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
    <!-- SIDEBAR (Width: 240px) -->
    <g id="Sidebar">
      <rect x="0" y="0" width="240" height="900" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- Brand Logo -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#03101E" stroke="#103A5C"/>
        <circle cx="17" cy="17" r="8" fill="none" stroke="#14E3A4" stroke-width="2.5"/>
        <circle cx="17" cy="17" r="3.5" fill="#00FFD0"/>
        <text x="46" y="24" fill="#F1F5F9" font-size="18" font-weight="800" letter-spacing="0.5">IronLink</text>
      </g>

      <!-- Section: NAVEGACIÓN -->
      <text x="20" y="92" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">NAVEGACIÓN</text>
      
      <!-- Item: Inicio -->
      <rect x="12" y="104" width="216" height="38" rx="8" fill="transparent"/>
      <circle cx="32" cy="123" r="3" fill="#94A3B8"/>
      <text x="48" y="128" fill="#94A3B8" font-size="13" font-weight="500">Inicio</text>

      <!-- Item: Mis nodos -->
      <rect x="12" y="146" width="216" height="38" rx="8" fill="transparent"/>
      <rect x="26" y="157" width="12" height="12" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="48" y="170" fill="#94A3B8" font-size="13" font-weight="500">Mis nodos</text>

      <!-- Item: Unirse a nodo -->
      <rect x="12" y="188" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="212" fill="#94A3B8" font-size="14">🔗</text>
      <text x="48" y="212" fill="#94A3B8" font-size="13" font-weight="500">Unirse a nodo</text>

      <!-- Section: RED -->
      <text x="20" y="254" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">RED</text>
      <rect x="12" y="266" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="290" fill="#94A3B8" font-size="14">🛡️</text>
      <text x="48" y="290" fill="#94A3B8" font-size="13" font-weight="500">Túnel VPN</text>

      <!-- Section: CANALES DE CHAT -->
      <text x="20" y="332" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">CANALES DE CHAT</text>
      
      <!-- Canal 1 -->
      <rect x="12" y="344" width="216" height="36" rx="8" fill="rgba(20,227,164,0.12)"/>
      <text x="26" y="367" fill="#14E3A4" font-size="13" font-weight="600">#</text>
      <text x="42" y="367" fill="#14E3A4" font-size="13" font-weight="700">Sala Principal</text>

      <!-- Canal 2 -->
      <rect x="12" y="384" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="407" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="407" fill="#94A3B8" font-size="13" font-weight="500">Backend Rust</text>

      <!-- Canal 3 -->
      <rect x="12" y="424" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="447" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="447" fill="#94A3B8" font-size="13" font-weight="500">Frontend UI/UX</text>

      <!-- Section: PERFIL (Bottom) -->
      <g transform="translate(0, 720)">
        <line x1="12" y1="0" x2="228" y2="0" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="24" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">PERFIL</text>
        
        <!-- User info button -->
        <rect x="12" y="34" width="216" height="42" rx="8" fill="transparent"/>
        <circle cx="32" cy="55" r="12" fill="#0A5C52" stroke="#14E3A4" stroke-width="1"/>
        <text x="32" y="59" fill="#14E3A4" font-size="10" font-weight="800" text-anchor="middle">LU</text>
        <text x="52" y="54" fill="#F1F5F9" font-size="13" font-weight="600">Ludwin</text>
        <rect x="52" y="59" width="46" height="15" rx="4" fill="rgba(20,227,164,0.15)"/>
        <text x="75" y="70" fill="#14E3A4" font-size="9" font-weight="800" text-anchor="middle">ADMIN</text>

        <!-- Config button -->
        <rect x="12" y="80" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="102" fill="#94A3B8" font-size="13">⚙️</text>
        <text x="48" y="102" fill="#94A3B8" font-size="13" font-weight="500">Configuración</text>

        <!-- Logout button -->
        <rect x="12" y="118" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="140" fill="#EF4444" font-size="13">🚪</text>
        <text x="48" y="140" fill="#EF4444" font-size="13" font-weight="600">Cerrar sesión</text>
      </g>
    </g>
    
  
    <!-- TOPBAR (Height: 64px, Width: 1200px) -->
    <g id="TopBar" transform="translate(240, 0)">
      <rect x="0" y="0" width="1200" height="64" fill="#03101E" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- VPN Badge -->
      <g transform="translate(24, 16)">
        <rect x="0" y="0" width="210" height="32" rx="16" fill="rgba(10,92,82,0.3)" stroke="#0A5C52" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#14E3A4"/>
        <text x="28" y="20" fill="#14E3A4" font-size="12" font-weight="700" letter-spacing="0.5">VPN · SALA-PRINCIPAL-ISW2</text>
      </g>

      <!-- Network status & Latency -->
      <g transform="translate(250, 24)">
        <circle cx="6" cy="8" r="3" fill="#00FFD0"/>
        <text x="16" y="12" fill="#64748B" font-size="12">14 ms · 1.2 MB/s P2P</text>
      </g>

      <!-- Right controls -->
      <g transform="translate(1080, 16)">
        <!-- Bell Icon -->
        <circle cx="20" cy="16" r="16" fill="#071B2D" stroke="#103A5C"/>
        <text x="14" y="21" fill="#94A3B8" font-size="14">🔔</text>
        <circle cx="28" cy="8" r="4" fill="#14E3A4"/>

        <!-- User Avatar -->
        <g transform="translate(56, 0)">
          <circle cx="16" cy="16" r="18" fill="url(#gradAvatar)" stroke="#103A5C" stroke-width="1.5"/>
          <text x="16" y="21" fill="#03101E" font-size="12" font-weight="800" text-anchor="middle">LU</text>
        </g>
      </g>
    </g>
    

  <!-- WORKSPACE CONTENT (x: 240, y: 64) -->
  <g transform="translate(240, 64)">
    
    <!-- Nodo Header + Tabs Bar -->
    <g id="NodoHeader">
      <rect x="0" y="0" width="1200" height="64" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- Title -->
      <g transform="translate(24, 18)">
        <text x="0" y="18" fill="#F1F5F9" font-size="17" font-weight="800"># Sala Principal — ISW 2</text>
        <circle cx="215" cy="12" r="3" fill="#14E3A4"/>
        <text x="226" y="16" fill="#14E3A4" font-size="12" font-weight="600">8 miembros</text>
      </g>

      <!-- Navigation Tabs (Chat, Subgrupos, Reuniones) -->
      <g transform="translate(420, 14)">
        <!-- Tab: Chat (Active) -->
        <rect x="0" y="0" width="110" height="36" rx="8" fill="rgba(20,227,164,0.15)" stroke="#14E3A4"/>
        <text x="55" y="23" fill="#14E3A4" font-size="13" font-weight="700" text-anchor="middle">💬 Chat</text>

        <!-- Tab: Subgrupos -->
        <rect x="120" y="0" width="130" height="36" rx="8" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="185" y="23" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">👥 Subgrupos (3)</text>

        <!-- Tab: Reuniones -->
        <rect x="260" y="0" width="130" height="36" rx="8" fill="#03101E" stroke="#103A5C" cursor="pointer"/>
        <text x="325" y="23" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">📅 Reuniones (2)</text>

        <!-- Tab: Info -->
        <rect x="400" y="0" width="80" height="36" rx="8" fill="#03101E" stroke="#103A5C"/>
        <text x="440" y="23" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">ℹ️ Info</text>
      </g>
    </g>

    <!-- Chat Messages Stream (Width: 940px, Height: 680px) -->
    <g id="MessageStream" transform="translate(0, 64)">
      
      <!-- Date Divider -->
      <g transform="translate(40, 25)">
        <line x1="0" y1="0" x2="860" y2="0" stroke="#103A5C" stroke-width="0.5"/>
        <rect x="360" y="-12" width="140" height="24" rx="12" fill="#071B2D" stroke="#103A5C"/>
        <text x="430" y="4" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">HOY, 25 DE AGOSTO</text>
      </g>

      <!-- Message 1: Carlos M. -->
      <g transform="translate(40, 60)">
        <circle cx="20" cy="20" r="18" fill="#0A5C52" stroke="#14E3A4"/>
        <text x="20" y="25" fill="#14E3A4" font-size="11" font-weight="800" text-anchor="middle">CM</text>
        <text x="50" y="16" fill="#F1F5F9" font-size="14" font-weight="700">Carlos Morales</text>
        <text x="160" y="16" fill="#64748B" font-size="12">09:15 AM</text>
        <text x="50" y="42" fill="#94A3B8" font-size="14">
          Hola equipo, ya subí la migración SQL <tspan fill="#00FFD0" font-weight="600">002_add_subgrupos.sql</tspan> al repositorio para revisión.
        </text>
      </g>

      <!-- Message 2: Diana R. -->
      <g transform="translate(40, 135)">
        <circle cx="20" cy="20" r="18" fill="#103A5C" stroke="#00FFD0"/>
        <text x="20" y="25" fill="#00FFD0" font-size="11" font-weight="800" text-anchor="middle">DR</text>
        <text x="50" y="16" fill="#F1F5F9" font-size="14" font-weight="700">Diana Rivera</text>
        <text x="145" y="16" fill="#64748B" font-size="12">09:18 AM</text>
        <text x="50" y="42" fill="#94A3B8" font-size="14">
          ¡Excelente! Acabo de probar el endpoint de WebSockets en Axum y la suscripción por canal funciona perfecto.
        </text>
      </g>

      <!-- Message 3: Ludwin (Tú) -->
      <g transform="translate(40, 210)">
        <circle cx="20" cy="20" r="18" fill="url(#gradAvatar)" stroke="#103A5C"/>
        <text x="20" y="25" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">LU</text>
        <text x="50" y="16" fill="#14E3A4" font-size="14" font-weight="700">Ludwin (Tú)</text>
        <text x="140" y="16" fill="#64748B" font-size="12">09:22 AM</text>
        <text x="50" y="42" fill="#F1F5F9" font-size="14">
          Genial. Estoy terminando la integración del prototipo interactivo en Figma para la presentación del Sprint 2 🚀
        </text>
      </g>

      <!-- Bottom Chat Input Bar -->
      <g transform="translate(30, 620)">
        <rect x="0" y="0" width="880" height="54" rx="12" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
        <text x="20" y="32" fill="#475569" font-size="14">Escribe un mensaje en # Sala Principal...</text>
        
        <!-- Action icons -->
        <g transform="translate(740, 10)">
          <text x="0" y="24" fill="#94A3B8" font-size="18">📎</text>
          <text x="35" y="24" fill="#94A3B8" font-size="18">😊</text>
          <rect x="70" y="0" width="60" height="34" rx="8" fill="url(#gradMint)" cursor="pointer"/>
          <text x="100" y="22" fill="#03101E" font-size="14" font-weight="800" text-anchor="middle">➤</text>
        </g>
      </g>
    </g>

    <!-- Right Members Sidebar (Width: 260px) -->
    <g id="MembersSidebar" transform="translate(940, 64)">
      <rect x="0" y="0" width="260" height="772" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- Section: En línea -->
      <text x="20" y="30" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">EN LÍNEA — 3</text>

      <!-- Member 1 -->
      <g transform="translate(20, 48)">
        <circle cx="14" cy="14" r="14" fill="url(#gradAvatar)"/>
        <circle cx="24" cy="24" r="4" fill="#14E3A4" stroke="#071B2D" stroke-width="1.5"/>
        <text x="14" y="18" fill="#03101E" font-size="10" font-weight="800" text-anchor="middle">LU</text>
        <text x="38" y="14" fill="#F1F5F9" font-size="13" font-weight="600">Ludwin</text>
        <text x="38" y="27" fill="#14E3A4" font-size="10" font-weight="700">CREADOR</text>
      </g>

      <!-- Member 2 -->
      <g transform="translate(20, 94)">
        <circle cx="14" cy="14" r="14" fill="#0A5C52"/>
        <circle cx="24" cy="24" r="4" fill="#14E3A4" stroke="#071B2D" stroke-width="1.5"/>
        <text x="14" y="18" fill="#14E3A4" font-size="10" font-weight="800" text-anchor="middle">CM</text>
        <text x="38" y="14" fill="#F1F5F9" font-size="13" font-weight="600">Carlos Morales</text>
        <text x="38" y="27" fill="#94A3B8" font-size="10">Backend Dev</text>
      </g>

      <!-- Member 3 -->
      <g transform="translate(20, 140)">
        <circle cx="14" cy="14" r="14" fill="#103A5C"/>
        <circle cx="24" cy="24" r="4" fill="#14E3A4" stroke="#071B2D" stroke-width="1.5"/>
        <text x="14" y="18" fill="#00FFD0" font-size="10" font-weight="800" text-anchor="middle">DR</text>
        <text x="38" y="14" fill="#F1F5F9" font-size="13" font-weight="600">Diana Rivera</text>
        <text x="38" y="27" fill="#94A3B8" font-size="10">Frontend Dev</text>
      </g>

      <!-- Section: Desconectados -->
      <text x="20" y="210" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">DESCONECTADOS — 5</text>
      
      <g transform="translate(20, 228)" opacity="0.6">
        <circle cx="14" cy="14" r="14" fill="#103A5C"/>
        <text x="14" y="18" fill="#94A3B8" font-size="10" font-weight="800" text-anchor="middle">DM</text>
        <text x="38" y="18" fill="#94A3B8" font-size="13">Dr. Morales</text>
      </g>

      <g transform="translate(20, 268)" opacity="0.6">
        <circle cx="14" cy="14" r="14" fill="#103A5C"/>
        <text x="14" y="18" fill="#94A3B8" font-size="10" font-weight="800" text-anchor="middle">RA</text>
        <text x="38" y="18" fill="#94A3B8" font-size="13">Roberto Alvarado</text>
      </g>
    </g>
  </g>
</svg>