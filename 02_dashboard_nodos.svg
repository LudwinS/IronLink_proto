<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
    <!-- SIDEBAR (Width: 240px) -->
    <g id="Sidebar">
      <rect x="0" y="0" width="240" height="900" fill="#071B2D" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- Brand Logo -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#03101E" stroke="#103A5C"/>
        <circle cx="17" cy="17" r="8" fill="none" stroke="#14E3A4" stroke-width="2.5"/>
        <circle cx="17" cy="17" r="3.5" fill="#00FFD0"/>
        <text x="46" y="24" fill="#F1F5F9" font-size="18" font-weight="800" letter-spacing="0.5">IronLink</text>
      </g>

      <!-- Section: NAVEGACIÓN -->
      <text x="20" y="92" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">NAVEGACIÓN</text>
      
      <!-- Item: Inicio -->
      <rect x="12" y="104" width="216" height="38" rx="8" fill="rgba(20,227,164,0.12)"/>
      <circle cx="32" cy="123" r="3" fill="#14E3A4"/>
      <text x="48" y="128" fill="#14E3A4" font-size="13" font-weight="700">Inicio</text>

      <!-- Item: Mis nodos -->
      <rect x="12" y="146" width="216" height="38" rx="8" fill="transparent"/>
      <rect x="26" y="157" width="12" height="12" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="48" y="170" fill="#94A3B8" font-size="13" font-weight="500">Mis nodos</text>

      <!-- Item: Unirse a nodo -->
      <rect x="12" y="188" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="212" fill="#94A3B8" font-size="14">🔗</text>
      <text x="48" y="212" fill="#94A3B8" font-size="13" font-weight="500">Unirse a nodo</text>

      <!-- Section: RED -->
      <text x="20" y="254" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">RED</text>
      <rect x="12" y="266" width="216" height="38" rx="8" fill="transparent"/>
      <text x="26" y="290" fill="#94A3B8" font-size="14">🛡️</text>
      <text x="48" y="290" fill="#94A3B8" font-size="13" font-weight="500">Túnel VPN</text>

      <!-- Section: CANALES DE CHAT -->
      <text x="20" y="332" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">CANALES DE CHAT</text>
      
      <!-- Canal 1 -->
      <rect x="12" y="344" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="367" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="367" fill="#94A3B8" font-size="13" font-weight="500">Sala Principal</text>

      <!-- Canal 2 -->
      <rect x="12" y="384" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="407" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="407" fill="#94A3B8" font-size="13" font-weight="500">Backend Rust</text>

      <!-- Canal 3 -->
      <rect x="12" y="424" width="216" height="36" rx="8" fill="transparent"/>
      <text x="26" y="447" fill="#94A3B8" font-size="13" font-weight="600">#</text>
      <text x="42" y="447" fill="#94A3B8" font-size="13" font-weight="500">Frontend UI/UX</text>

      <!-- Section: PERFIL (Bottom) -->
      <g transform="translate(0, 720)">
        <line x1="12" y1="0" x2="228" y2="0" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="24" fill="#475569" font-size="11" font-weight="700" letter-spacing="1.2">PERFIL</text>
        
        <!-- User info button -->
        <rect x="12" y="34" width="216" height="42" rx="8" fill="transparent"/>
        <circle cx="32" cy="55" r="12" fill="#0A5C52" stroke="#14E3A4" stroke-width="1"/>
        <text x="32" y="59" fill="#14E3A4" font-size="10" font-weight="800" text-anchor="middle">LU</text>
        <text x="52" y="54" fill="#F1F5F9" font-size="13" font-weight="600">Ludwin</text>
        <rect x="52" y="59" width="46" height="15" rx="4" fill="rgba(20,227,164,0.15)"/>
        <text x="75" y="70" fill="#14E3A4" font-size="9" font-weight="800" text-anchor="middle">ADMIN</text>

        <!-- Config button -->
        <rect x="12" y="80" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="102" fill="#94A3B8" font-size="13">⚙️</text>
        <text x="48" y="102" fill="#94A3B8" font-size="13" font-weight="500">Configuración</text>

        <!-- Logout button -->
        <rect x="12" y="118" width="216" height="34" rx="8" fill="transparent"/>
        <text x="26" y="140" fill="#EF4444" font-size="13">🚪</text>
        <text x="48" y="140" fill="#EF4444" font-size="13" font-weight="600">Cerrar sesión</text>
      </g>
    </g>
    
  
    <!-- TOPBAR (Height: 64px, Width: 1200px) -->
    <g id="TopBar" transform="translate(240, 0)">
      <rect x="0" y="0" width="1200" height="64" fill="#03101E" stroke="#103A5C" stroke-width="0.5"/>
      
      <!-- VPN Badge -->
      <g transform="translate(24, 16)">
        <rect x="0" y="0" width="210" height="32" rx="16" fill="rgba(10,92,82,0.3)" stroke="#0A5C52" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#14E3A4"/>
        <text x="28" y="20" fill="#14E3A4" font-size="12" font-weight="700" letter-spacing="0.5">VPN · IRONLINK-NODE-01</text>
      </g>

      <!-- Network status & Latency -->
      <g transform="translate(250, 24)">
        <circle cx="6" cy="8" r="3" fill="#00FFD0"/>
        <text x="16" y="12" fill="#64748B" font-size="12">14 ms · 1.2 MB/s P2P</text>
      </g>

      <!-- Right controls -->
      <g transform="translate(1080, 16)">
        <!-- Bell Icon -->
        <circle cx="20" cy="16" r="16" fill="#071B2D" stroke="#103A5C"/>
        <text x="14" y="21" fill="#94A3B8" font-size="14">🔔</text>
        <circle cx="28" cy="8" r="4" fill="#14E3A4"/>

        <!-- User Avatar -->
        <g transform="translate(56, 0)">
          <circle cx="16" cy="16" r="18" fill="url(#gradAvatar)" stroke="#103A5C" stroke-width="1.5"/>
          <text x="16" y="21" fill="#03101E" font-size="12" font-weight="800" text-anchor="middle">LU</text>
        </g>
      </g>
    </g>
    

  <!-- MAIN CONTENT AREA (x: 240, y: 64, w: 1200, h: 836) -->
  <g transform="translate(240, 64)">
    <!-- Header Section -->
    <g transform="translate(40, 36)">
      <text x="0" y="24" fill="#F1F5F9" font-size="24" font-weight="800">Mis Nodos Activos (3)</text>
      <text x="0" y="50" fill="#94A3B8" font-size="14">Espacios de comunicación, colaboración y canales persistentes</text>

      <!-- Action Buttons -->
      <g transform="translate(740, 0)">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="#071B2D" stroke="#103A5C" cursor="pointer"/>
        <text x="85" y="26" fill="#F1F5F9" font-size="13" font-weight="600" text-anchor="middle">🔗 Unirse con Token</text>

        <rect x="185" y="0" width="195" height="42" rx="10" fill="url(#gradMint)" cursor="pointer"/>
        <text x="282" y="26" fill="#03101E" font-size="13" font-weight="800" text-anchor="middle">+ Crear Nuevo Nodo</text>
      </g>
    </g>

    <!-- Grid of Nodo Cards (3 Columns) -->
    <g transform="translate(40, 120)">
      <!-- CARD 1: Sala Principal -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="360" height="210" rx="14" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
        
        <!-- Status indicator + Badge -->
        <circle cx="24" cy="24" r="5" fill="#14E3A4"/>
        <rect x="260" y="14" width="76" height="24" rx="12" fill="rgba(20,227,164,0.15)" stroke="rgba(20,227,164,0.4)"/>
        <text x="298" y="30" fill="#14E3A4" font-size="11" font-weight="700" text-anchor="middle">Activo</text>

        <!-- Nodo Title -->
        <text x="20" y="70" fill="#F1F5F9" font-size="17" font-weight="700">Sala Principal — ISW 2</text>
        
        <!-- Token & Creator -->
        <text x="20" y="98" fill="#64748B" font-size="12">IRL-A9F34C2B · Ludwin (Tú)</text>
        <text x="20" y="125" fill="#94A3B8" font-size="13">Coordinación general de sprint y proyectos de cátedra.</text>

        <!-- Bottom stats -->
        <line x1="20" y1="155" x2="340" y2="155" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="185" fill="#94A3B8" font-size="12">👥 8 miembros</text>
        <text x="130" y="185" fill="#00FFD0" font-size="12">💬 3 subgrupos</text>
        
        <rect x="250" y="165" width="90" height="30" rx="6" fill="#14E3A4" cursor="pointer"/>
        <text x="295" y="185" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">ENTRAR →</text>
      </g>

      <!-- CARD 2: Backend Rust Tokio -->
      <g transform="translate(380, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="360" height="210" rx="14" fill="#071B2D" stroke="#103A5C"/>
        
        <circle cx="24" cy="24" r="5" fill="#14E3A4"/>
        <rect x="260" y="14" width="76" height="24" rx="12" fill="rgba(20,227,164,0.15)" stroke="rgba(20,227,164,0.4)"/>
        <text x="298" y="30" fill="#14E3A4" font-size="11" font-weight="700" text-anchor="middle">Activo</text>

        <text x="20" y="70" fill="#F1F5F9" font-size="17" font-weight="700">Backend Rust Tokio</text>
        <text x="20" y="98" fill="#64748B" font-size="12">IRL-B88E12A0 · Carlos M.</text>
        <text x="20" y="125" fill="#94A3B8" font-size="13">Servidores Axum, WebSockets y consultas SQLx.</text>

        <line x1="20" y1="155" x2="340" y2="155" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="185" fill="#94A3B8" font-size="12">👥 4 miembros</text>
        <text x="130" y="185" fill="#00FFD0" font-size="12">💬 1 subgrupo</text>

        <rect x="250" y="165" width="90" height="30" rx="6" fill="#103A5C" cursor="pointer"/>
        <text x="295" y="185" fill="#F1F5F9" font-size="11" font-weight="700" text-anchor="middle">ENTRAR →</text>
      </g>

      <!-- CARD 3: UI/UX Flutter -->
      <g transform="translate(760, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="360" height="210" rx="14" fill="#071B2D" stroke="#103A5C"/>
        
        <circle cx="24" cy="24" r="5" fill="#64748B"/>
        <rect x="260" y="14" width="76" height="24" rx="12" fill="rgba(100,116,139,0.15)" stroke="#64748B"/>
        <text x="298" y="30" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">Inactivo</text>

        <text x="20" y="70" fill="#F1F5F9" font-size="17" font-weight="700">Laboratorio UI/UX Flutter</text>
        <text x="20" y="98" fill="#64748B" font-size="12">IRL-7728FA4D · Diana R.</text>
        <text x="20" y="125" fill="#94A3B8" font-size="13">Componentes visuales Riverpod y diseño Figma.</text>

        <line x1="20" y1="155" x2="340" y2="155" stroke="#103A5C" stroke-width="0.5"/>
        <text x="20" y="185" fill="#94A3B8" font-size="12">👥 3 miembros</text>
        <text x="130" y="185" fill="#64748B" font-size="12">💬 0 subgrupos</text>

        <rect x="250" y="165" width="90" height="30" rx="6" fill="#103A5C" cursor="pointer"/>
        <text x="295" y="185" fill="#F1F5F9" font-size="11" font-weight="700" text-anchor="middle">ENTRAR →</text>
      </g>
    </g>

    <!-- Network Metrics Banner -->
    <g transform="translate(40, 380)">
      <rect x="0" y="0" width="1120" height="110" rx="14" fill="#071B2D" stroke="#103A5C"/>
      
      <g transform="translate(30, 25)">
        <text x="0" y="20" fill="#14E3A4" font-size="13" font-weight="700" letter-spacing="1">MÉTRICAS DE RED DESCENTRALIZADA</text>
        <text x="0" y="55" fill="#F1F5F9" font-size="28" font-weight="800">100% Operativo</text>
        <text x="220" y="55" fill="#64748B" font-size="13">PostgreSQL pool activo · Tokio async runtime</text>
      </g>

      <!-- Mini KPI 1 -->
      <g transform="translate(620, 30)">
        <text x="0" y="16" fill="#94A3B8" font-size="12">Latencia P2P</text>
        <text x="0" y="44" fill="#00FFD0" font-size="22" font-weight="800">14 ms</text>
      </g>

      <!-- Mini KPI 2 -->
      <g transform="translate(780, 30)">
        <text x="0" y="16" fill="#94A3B8" font-size="12">Nodos Conectados</text>
        <text x="0" y="44" fill="#14E3A4" font-size="22" font-weight="800">15 Peers</text>
      </g>

      <!-- Mini KPI 3 -->
      <g transform="translate(940, 30)">
        <text x="0" y="16" fill="#94A3B8" font-size="12">Cifrado de Sesión</text>
        <text x="0" y="44" fill="#F1F5F9" font-size="20" font-weight="800">TLS 1.3 + JWT</text>
      </g>
    </g>
  </g>
</svg>