<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Hero Panel (864px) -->
  <rect x="0" y="0" width="864" height="900" fill="url(#gradHero)" stroke="#103A5C" stroke-width="0.5"/>
  <circle cx="200" cy="250" r="180" fill="#14E3A4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="650" r="220" fill="#00FFD0" opacity="0.06" filter="url(#glow)"/>

  <!-- Network Mesh -->
  <g opacity="0.25" stroke="#103A5C" stroke-width="1.5">
    <line x1="150" y1="350" x2="350" y2="280" />
    <line x1="350" y1="280" x2="550" y2="380" />
    <line x1="550" y1="380" x2="400" y2="520" />
    <line x1="400" y1="520" x2="200" y2="480" />
    <line x1="200" y1="480" x2="150" y2="350" />
    <line x1="350" y1="280" x2="400" y2="520" />
    <line x1="550" y1="380" x2="680" y2="300" />
    <line x1="400" y1="520" x2="600" y2="600" />
  </g>
  <circle cx="150" cy="350" r="6" fill="#14E3A4" />
  <circle cx="350" cy="280" r="8" fill="#00FFD0" />
  <circle cx="550" cy="380" r="7" fill="#14E3A4" />
  <circle cx="400" cy="520" r="9" fill="#14E3A4" />
  <circle cx="200" cy="480" r="5" fill="#00FFD0" />
  <circle cx="680" cy="300" r="6" fill="#14E3A4" />
  <circle cx="600" cy="600" r="6" fill="#00FFD0" />

  <!-- Hero Content -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" fill="none" stroke="#14E3A4" stroke-width="3"/>
    <circle cx="24" cy="24" r="4" fill="#00FFD0"/>
    <text x="64" y="32" fill="#F1F5F9" font-size="24" font-weight="800" letter-spacing="0.5">IronLink</text>

    <text x="0" y="130" fill="#14E3A4" font-size="14" font-weight="700" letter-spacing="2">CONECTA • COMUNICA • COLABORA</text>
    <text x="0" y="190" fill="#F1F5F9" font-size="44" font-weight="800">Red descentralizada</text>
    <text x="0" y="240" fill="#F1F5F9" font-size="44" font-weight="800">para equipos de alta</text>
    <text x="0" y="290" fill="#00FFD0" font-size="44" font-weight="800">ingeniería de software.</text>
    
    <text x="0" y="350" fill="#94A3B8" font-size="16">Crea nodos colaborativos, comunícate con chat persistente,</text>
    <text x="0" y="375" fill="#94A3B8" font-size="16">organiza subgrupos temáticos y programa sesiones con seguridad integral.</text>

    <!-- Badges -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#071B2D" stroke="#103A5C"/>
      <circle cx="24" cy="21" r="5" fill="#14E3A4"/>
      <text x="40" y="26" fill="#F1F5F9" font-size="13" font-weight="600">Túnel VPN Seguro</text>

      <rect x="185" y="0" width="190" height="42" rx="10" fill="#071B2D" stroke="#103A5C"/>
      <circle cx="209" cy="21" r="5" fill="#00FFD0"/>
      <text x="225" y="26" fill="#F1F5F9" font-size="13" font-weight="600">WebSockets Realtime</text>

      <rect x="390" y="0" width="170" height="42" rx="10" fill="#071B2D" stroke="#103A5C"/>
      <circle cx="414" cy="21" r="5" fill="#14E3A4"/>
      <text x="430" y="26" fill="#F1F5F9" font-size="13" font-weight="600">PostgreSQL + Rust</text>
    </g>
  </g>

  <!-- Right Form Panel -->
  <g transform="translate(864, 0)">
    <rect x="0" y="0" width="576" height="900" fill="#03101E"/>
    
    <g transform="translate(70, 160)">
      <text x="0" y="40" fill="#F1F5F9" font-size="28" font-weight="800">Bienvenido de nuevo</text>
      <text x="0" y="70" fill="#94A3B8" font-size="14">Ingresa tus credenciales para acceder a la red de nodos</text>

      <!-- Email Field -->
      <text x="0" y="130" fill="#94A3B8" font-size="13" font-weight="600">Correo institucional o usuario</text>
      <rect x="0" y="145" width="436" height="48" rx="10" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
      <text x="16" y="175" fill="#F1F5F9" font-size="14">ludwin@universidad.edu.sv</text>

      <!-- Password Field -->
      <text x="0" y="225" fill="#94A3B8" font-size="13" font-weight="600">Contraseña</text>
      <rect x="0" y="240" width="436" height="48" rx="10" fill="#071B2D" stroke="#103A5C" stroke-width="1.5"/>
      <text x="16" y="270" fill="#94A3B8" font-size="16">••••••••••••••••</text>
      
      <!-- Remember Me & Link -->
      <rect x="0" y="310" width="18" height="18" rx="4" fill="#14E3A4"/>
      <path d="M4 319 L8 323 L14 314" stroke="#03101E" stroke-width="2.5" fill="none"/>
      <text x="28" y="324" fill="#94A3B8" font-size="13">Recordarme</text>
      <text x="280" y="324" fill="#14E3A4" font-size="13" font-weight="600">¿Olvidaste tu clave?</text>

      <!-- Submit Button -->
      <rect x="0" y="360" width="436" height="50" rx="10" fill="url(#gradMint)" cursor="pointer"/>
      <text x="218" y="391" fill="#03101E" font-size="15" font-weight="800" text-anchor="middle">INICIAR SESIÓN</text>

      <!-- Register switch -->
      <text x="130" y="450" fill="#94A3B8" font-size="14">¿No tienes una cuenta?</text>
      <text x="290" y="450" fill="#00FFD0" font-size="14" font-weight="700">Regístrate</text>

      <!-- Security Notice -->
      <rect x="0" y="520" width="436" height="50" rx="10" fill="#071B2D" stroke="#103A5C" stroke-dasharray="4"/>
      <text x="218" y="550" fill="#475569" font-size="12" text-anchor="middle">Autenticación segura JWT con hash Argon2id</text>
    </g>
  </g>
</svg>