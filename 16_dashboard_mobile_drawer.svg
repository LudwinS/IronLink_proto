<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#03101E; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B2D" />
      <stop offset="100%" stop-color="#03101E" />
    </linearGradient>
    <linearGradient id="gradMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14E3A4" />
      <stop offset="100%" stop-color="#00FFD0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  
  <!-- Mobile container simulation (Width: 420px, Height: 840px in center) -->
  <g transform="translate(510, 30)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="420" height="840" rx="30" fill="#03101E" stroke="#103A5C" stroke-width="3"/>
    
    <!-- Mobile Top Bar -->
    <rect x="0" y="0" width="420" height="70" rx="30" fill="#071B2D"/>
    <text x="24" y="44" fill="#14E3A4" font-size="20">✕</text>
    <text x="60" y="44" fill="#F1F5F9" font-size="16" font-weight="800">Menú IronLink</text>
    
    <!-- Drawer Items -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="380" height="48" rx="10" fill="rgba(20,227,164,0.15)"/>
      <text x="20" y="30" fill="#14E3A4" font-size="15" font-weight="700">🏠 Inicio</text>

      <rect x="0" y="60" width="380" height="48" rx="10" fill="transparent"/>
      <text x="20" y="90" fill="#94A3B8" font-size="15">📦 Mis nodos (3)</text>

      <rect x="0" y="120" width="380" height="48" rx="10" fill="transparent"/>
      <text x="20" y="150" fill="#94A3B8" font-size="15">🔗 Unirse a nodo</text>

      <rect x="0" y="180" width="380" height="48" rx="10" fill="transparent"/>
      <text x="20" y="210" fill="#94A3B8" font-size="15">🛡️ Túnel VPN (Conectado)</text>

      <line x1="0" y1="250" x2="380" y2="250" stroke="#103A5C"/>
      <text x="10" y="280" fill="#475569" font-size="12" font-weight="700">CANALES</text>
      
      <text x="20" y="315" fill="#14E3A4" font-size="14"># Sala Principal</text>
      <text x="20" y="355" fill="#94A3B8" font-size="14"># Backend Rust</text>
      <text x="20" y="395" fill="#94A3B8" font-size="14"># Frontend UI</text>

      <!-- Bottom Profile -->
      <g transform="translate(0, 520)">
        <circle cx="20" cy="20" r="18" fill="url(#gradAvatar)"/>
        <text x="20" y="25" fill="#03101E" font-size="11" font-weight="800" text-anchor="middle">LU</text>
        <text x="50" y="18" fill="#F1F5F9" font-size="14" font-weight="700">Ludwin</text>
        <text x="50" y="34" fill="#14E3A4" font-size="11">ADMIN</text>
        
        <rect x="0" y="60" width="380" height="44" rx="8" fill="rgba(239,68,68,0.15)"/>
        <text x="190" y="87" fill="#EF4444" font-size="13" font-weight="700" text-anchor="middle">Cerrar sesión</text>
      </g>
    </g>
  </g>

</svg>